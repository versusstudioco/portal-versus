<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VERSUS · Cerrar seguridad</title>
<style>
  body { font-family: "Bricolage Grotesque", system-ui, sans-serif; background: #f5f5f5; color: #111; max-width: 720px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; }
  .card { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  button { font-family: inherit; font-size: 15px; font-weight: 700; background: #F90000; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .ok { color: #1e8e3e; font-weight: 700; }
  code { background: #eee; padding: 1px 5px; border-radius: 4px; }
  #log { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>🔒 Cerrar seguridad — borrar contraseñas en texto plano</h1>
  <div class="card">
    <p>Las contraseñas ya viven <b>encriptadas</b> en Firebase Authentication. Esto borra las
    copias <b>en texto plano</b> que quedaban en la base (campo <code>pass</code>), sin tocar nada más
    (nombres, marcas y configuración se conservan). El login sigue funcionando con Auth.</p>
    <button id="run">▶ Borrar contraseñas expuestas</button>
    <p id="status" style="margin-top:12px;color:#666"></p>
    <div id="log"></div>
  </div>
</body>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const cfg = { apiKey:"AIzaSyAKgL0la08wjXBL4VhlcqRlE8Ory1KKC80", authDomain:"versus-portal.firebaseapp.com", databaseURL:"https://versus-portal-default-rtdb.firebaseio.com", projectId:"versus-portal", storageBucket:"versus-portal.firebasestorage.app", messagingSenderId:"689127935637", appId:"1:689127935637:web:0d42a61192c4e1440b559c" };
firebase.initializeApp(cfg);
document.getElementById("run").addEventListener("click", async () => {
  const btn = document.getElementById("run"); btn.disabled = true;
  const st = document.getElementById("status"); const log = document.getElementById("log");
  st.textContent = "Leyendo cuentas…";
  try {
    const snap = await firebase.database().ref("vsportal/creds").once("value");
    const creds = snap.val() || {};
    let n = 0;
    for (const u of Object.keys(creds)) {
      if (creds[u] && "pass" in creds[u]) { creds[u].pass = null; n++; }  // null = borra el campo
    }
    await firebase.database().ref("vsportal/creds").set(creds);
    st.innerHTML = '<span class="ok">✅ Listo. Contraseñas en texto plano borradas de la base ('+n+' cuentas).</span>';
    log.innerHTML = '<p style="margin-top:10px">Ahora publica las <b>reglas cerradas</b> en Firebase (paso siguiente que te dio Versus) y quedará todo protegido.</p>';
  } catch (e) {
    st.innerHTML = '<span style="color:#F90000">Error: '+(e.message||e)+'</span>';
    btn.disabled = false;
  }
});
</script>
</html>
