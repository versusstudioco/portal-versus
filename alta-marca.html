<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VERSUS · Nueva marca</title>
<link rel="icon" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{ --fn:"Bricolage Grotesque",sans-serif; --red:#F90000; --tx:#111; --t2:#666; --t3:#aaa; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ font-family:var(--fn); color:var(--tx); min-height:100vh; display:flex; flex-direction:column;
    background: radial-gradient(1000px 600px at 85% -8%, rgba(249,0,0,.07), transparent 60%), radial-gradient(800px 600px at -8% 108%, rgba(108,0,255,.06), transparent 60%), #eef0f4; }
  .bar{ height:5px; background:rgba(0,0,0,.06); }
  .bar__fill{ height:100%; background:var(--red); width:0; transition:width .3s cubic-bezier(.2,.8,.2,1); }
  .top{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px; }
  .top img{ height:22px; }
  .top .paso{ font-size:12px; color:var(--t3); font-weight:600; }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:640px; }
  .q{ display:none; animation:rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .q.on{ display:block; }
  .q__n{ font-size:12px; font-weight:700; color:var(--red); letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  .q__t{ font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-bottom:6px; }
  .q__h{ font-size:14px; color:var(--t2); margin-bottom:18px; }
  input[type=text], textarea{ width:100%; font-family:inherit; font-size:18px; padding:14px 16px; border:1.5px solid rgba(0,0,0,.1); border-radius:14px; background:rgba(255,255,255,.75); outline:none; transition:border-color .2s; }
  input[type=text]:focus, textarea:focus{ border-color:var(--red); }
  textarea{ resize:vertical; min-height:110px; }
  .opts{ display:flex; gap:10px; }
  .opt{ flex:1; text-align:center; padding:14px; border:1.5px solid rgba(0,0,0,.1); border-radius:14px; background:rgba(255,255,255,.75); font-size:16px; font-weight:700; cursor:pointer; }
  .opt.sel{ border-color:var(--red); background:rgba(249,0,0,.06); color:var(--red); }
  .manual-extra{ margin-top:14px; display:none; }
  .row{ display:flex; gap:10px; align-items:center; margin-top:26px; }
  .btn{ font-family:inherit; font-weight:700; font-size:15px; border:none; border-radius:999px; padding:12px 24px; cursor:pointer; }
  .btn-red{ background:var(--red); color:#fff; } .btn-red:hover{ background:#c40000; }
  .btn-ghost{ background:transparent; color:var(--t2); }
  .hint{ font-size:12px; color:var(--t3); }
  .done{ text-align:center; }
  .done h1{ font-size:30px; font-weight:800; margin-bottom:10px; }
  .done p{ color:var(--t2); }
</style>
</head>
<body>
  <div class="bar"><div class="bar__fill" id="bar"></div></div>
  <div class="top"><img src="/logo.png" alt="VERSUS"><span class="paso" id="paso"></span></div>
  <main><div class="card" id="card"></div></main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyAKgL0la08wjXBL4VhlcqRlE8Ory1KKC80",authDomain:"versus-portal.firebaseapp.com",databaseURL:"https://versus-portal-default-rtdb.firebaseio.com",projectId:"versus-portal",storageBucket:"versus-portal.firebasestorage.app",messagingSenderId:"689127935637",appId:"1:689127935637:web:0d42a61192c4e1440b559c"};
firebase.initializeApp(cfg);
const RTDB="https://versus-portal-default-rtdb.firebaseio.com/vsportal";
const PREGUNTAS=[
  {key:"marca", n:"01", t:"¿Cuál es tu marca?", h:"El nombre con el que te conocen.", type:"text", req:true},
  {key:"hacen", n:"02", t:"¿Qué hacen?", h:"En pocas líneas, a qué se dedica tu marca.", type:"area", req:true},
  {key:"clientes", n:"03", t:"¿Cuáles son tus clientes?", h:"A quién le vendes o le hablas.", type:"area"},
  {key:"tresPalabras", n:"04", t:"Describe en 3 palabras tu marca.", h:"Las 3 que mejor la definen.", type:"text"},
  {key:"inspiran", n:"05", t:"¿Qué marcas te inspiran y por qué?", h:"Referentes que admiras.", type:"area"},
  {key:"redes", n:"06", t:"Copia tus redes sociales.", h:"Instagram, TikTok, web… pega los links.", type:"area"},
  {key:"esperan", n:"07", t:"¿Qué esperas de Versus como tu equipo?", h:"Qué te gustaría lograr con nosotros.", type:"area"},
  {key:"manual", n:"08", t:"¿Tienes manual de marca?", h:"Si sí, pega el link o súbelo.", type:"manual"}
];
let i=0; const R={};
const card=document.getElementById("card"), bar=document.getElementById("bar"), paso=document.getElementById("paso");
function render(){
  const q=PREGUNTAS[i];
  paso.textContent=(i+1)+" / "+PREGUNTAS.length;
  bar.style.width=(i/PREGUNTAS.length*100)+"%";
  let field="";
  if(q.type==="text") field=`<input type="text" id="f" value="${(R[q.key]||"").replace(/"/g,'&quot;')}" placeholder="Escribe aquí…">`;
  else if(q.type==="area") field=`<textarea id="f" placeholder="Escribe aquí…">${R[q.key]||""}</textarea>`;
  else if(q.type==="manual") field=`
    <div class="opts"><div class="opt" data-v="si">Sí, tengo</div><div class="opt" data-v="no">No aún</div></div>
    <div class="manual-extra" id="mx">
      <input type="text" id="mlink" placeholder="Pega el link del manual (Drive, etc.)" value="${(R.manualLink||"").replace(/"/g,'&quot;')}" style="margin-bottom:10px">
      <label class="btn btn-ghost" style="border:1.5px dashed rgba(0,0,0,.15);display:inline-block">📎 Subir archivo (PDF/imagen, máx 3MB)<input type="file" id="mfile" accept="application/pdf,image/*" hidden></label>
      <span class="hint" id="mfilename"></span>
    </div>`;
  card.innerHTML=`<div class="q on"><div class="q__n">${q.n}</div><div class="q__t">${q.t}</div><div class="q__h">${q.h}</div>${field}
    <div class="row">${i>0?'<button class="btn btn-ghost" id="back">← Atrás</button>':''}<button class="btn btn-red" id="next">${i===PREGUNTAS.length-1?'Enviar':'Siguiente →'}</button></div></div>`;
  const f=document.getElementById("f"); if(f) f.focus();
  if(q.type==="manual"){
    const mx=document.getElementById("mx"); if(R.manual) mx.style.display="block";
    card.querySelectorAll(".opt").forEach(o=>{ if(R.manual===o.dataset.v)o.classList.add("sel"); o.onclick=()=>{ card.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); o.classList.add("sel"); R.manual=o.dataset.v; mx.style.display=o.dataset.v==="si"?"block":"none"; }; });
    const mf=document.getElementById("mfile"); mf.onchange=()=>{ const file=mf.files[0]; if(!file)return; if(file.size>3*1024*1024){ alert("Máx 3MB. Mejor pega el link."); mf.value=""; return; } const rd=new FileReader(); rd.onload=()=>{ R.manualData=rd.result; R.manualNombre=file.name; document.getElementById("mfilename").textContent=" "+file.name; }; rd.readAsDataURL(file); };
  }
  const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{ save(); i--; render(); };
  document.getElementById("next").onclick=()=>{ if(!save()) return; if(i===PREGUNTAS.length-1) enviar(); else { i++; render(); } };
  if(f) f.addEventListener("keydown",e=>{ if(e.key==="Enter"&&q.type!=="area"){ e.preventDefault(); document.getElementById("next").click(); } });
}
function save(){ const q=PREGUNTAS[i], f=document.getElementById("f");
  if(f){ R[q.key]=f.value.trim(); }
  if(q.key==="manual" && document.getElementById("mlink")) R.manualLink=document.getElementById("mlink").value.trim();
  if(q.req && !(R[q.key]||"").trim()){ if(f){ f.style.borderColor="#F90000"; f.focus(); } return false; }
  return true;
}
async function enviar(){
  card.innerHTML='<div class="done"><h1>Enviando…</h1></div>';
  const id="ob"+Date.now().toString(36);
  const payload=Object.assign({}, R, {at:new Date().toISOString()});
  try{
    const r=await fetch(RTDB+"/onboarding/"+id+".json",{method:"PUT",body:JSON.stringify(payload)});
    if(!r.ok) throw new Error("no");
    bar.style.width="100%"; paso.textContent="";
    card.innerHTML='<div class="done"><h1>¡Listo! 🎉</h1><p>Recibimos la info de <b>'+(R.marca||"tu marca")+'</b>. El equipo de Versus la revisará y te contacta.</p></div>';
  }catch(e){ card.innerHTML='<div class="done"><h1>Ups</h1><p>No se pudo enviar. Escríbenos y lo revisamos.</p></div>'; }
}
render();
</script>
</body>
</html>
