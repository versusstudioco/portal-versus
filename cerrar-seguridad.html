<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VERSUS · Cerrar seguridad</title>
<style>
  body { font-family: "Bricolage Grotesque", system-ui, sans-serif; background: #f5f5f5; color: #111; max-width: 560px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 21px; }
  .card { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  label { display:block; font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#aaa; margin:10px 0 5px; }
  input { width:100%; padding:11px 13px; background:#efefef; border:1.5px solid rgba(0,0,0,.07); border-radius:10px; font-size:14px; font-family:inherit; outline:none; }
  button { font-family: inherit; font-size: 15px; font-weight: 700; background: #F90000; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; margin-top:14px; width:100%; }
  button:disabled { opacity: .5; }
  .ok { color: #1e8e3e; font-weight: 700; } .err { color:#F90000; font-weight:700; }
  #log { font-size: 14px; line-height: 1.6; margin-top:12px; }
</style>
</head>
<body>
  <h1>🔒 Cerrar seguridad — borrar contraseñas en texto plano</h1>
  <div class="card">
    <p style="font-size:14px;color:#666">Inicia sesión como <b>admin</b> para borrar las copias de contraseñas
    en texto plano de la base (las claves siguen encriptadas en Auth). Solo el admin puede hacerlo.</p>
    <label>Usuario admin</label>
    <input id="u" value="versus_admin" autocomplete="username">
    <label>Contraseña admin</label>
    <input id="p" type="password" placeholder="tu clave de admin" autocomplete="current-password">
    <button id="run">▶ Iniciar sesión y borrar contraseñas expuestas</button>
    <div id="log"></div>
  </div>
</body>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const cfg = { apiKey:"AIzaSyAKgL0la08wjXBL4VhlcqRlE8Ory1KKC80", authDomain:"versus-portal.firebaseapp.com", databaseURL:"https://versus-portal-default-rtdb.firebaseio.com", projectId:"versus-portal", storageBucket:"versus-portal.firebasestorage.app", messagingSenderId:"689127935637", appId:"1:689127935637:web:0d42a61192c4e1440b559c" };
firebase.initializeApp(cfg);
const DOM = "@portal.versusstudio.co";
document.getElementById("run").addEventListener("click", async () => {
  const btn = document.getElementById("run"); const log = document.getElementById("log");
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  btn.disabled = true; log.innerHTML = "Iniciando sesión…";
  try {
    await firebase.auth().signInWithEmailAndPassword(u + DOM, p);
  } catch(e) { log.innerHTML = '<span class="err">No se pudo iniciar sesión: '+(e.code||e.message)+'</span>'; btn.disabled=false; return; }
  try {
    log.innerHTML = "Leyendo cuentas…";
    const snap = await firebase.database().ref("vsportal/creds").once("value");
    const creds = snap.val() || {};
    let n = 0;
    for (const k of Object.keys(creds)) { if (creds[k] && "pass" in creds[k]) { creds[k].pass = null; n++; } }
    await firebase.database().ref("vsportal/creds").set(creds);
    await firebase.auth().signOut();
    log.innerHTML = '<span class="ok">✅ Listo. Contraseñas en texto plano borradas ('+n+' cuentas).</span><br>Tu portal quedó protegido: sin login nadie ve nada y las claves solo viven encriptadas en Auth.';
  } catch(e) {
    log.innerHTML = '<span class="err">Error al borrar: '+(e.message||e)+'</span>';
    btn.disabled = false;
  }
});
</script>
</html>
