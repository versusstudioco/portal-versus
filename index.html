<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VERSUS Studio · Portal</title>
<link rel="icon" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{ --fn:"Bricolage Grotesque",sans-serif; --red:#F90000; --tx:#111; --t2:#666; --t3:#aaa; --card:#fff; --bd:rgba(0,0,0,.07); --sh:0 4px 20px rgba(0,0,0,.08); --r:16px; --rs:10px; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ font-family:var(--fn); color:var(--tx); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(ellipse 60% 50% at 80% 8%, rgba(249,0,0,.06), transparent), radial-gradient(ellipse 50% 60% at 8% 92%, rgba(108,0,255,.05), transparent), #f5f5f5; }
  .wrap{ width:100%; max-width:720px; }
  .logo{ text-align:center; margin-bottom:22px; }
  .logo img{ width:120px; margin:0 auto; display:block; }
  .logo .sub{ font-size:9px; letter-spacing:6px; color:var(--t3); text-transform:uppercase; margin-top:9px; }
  .doors{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media(max-width:560px){ .doors{ grid-template-columns:1fr; } }
  .door{ background:var(--card); border:1px solid var(--bd); border-radius:var(--r); box-shadow:var(--sh); padding:24px 24px 22px; transition:transform .18s, box-shadow .18s; }
  .door:hover{ transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.10); }
  .door__eyebrow{ font-size:9px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--t3); margin-bottom:6px; }
  .door__title{ font-size:20px; font-weight:800; letter-spacing:-.01em; margin-bottom:6px; }
  .door__desc{ font-size:13px; line-height:1.5; color:var(--t2); margin-bottom:16px; }
  .door__btn{ display:block; width:100%; text-align:center; text-decoration:none; font-weight:700; font-size:14px; color:#fff; background:var(--red); border-radius:var(--rs); padding:13px; transition:background .2s; }
  .door__btn:hover{ background:#c40000; }
  .door__btn--dark{ background:#111; } .door__btn--dark:hover{ background:#000; }
  .foot{ text-align:center; color:var(--t3); font-size:10px; letter-spacing:3px; text-transform:uppercase; margin-top:22px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="/logo.png" alt="VERSUS STUDIO" />
      <div class="sub">Portal</div>
    </div>
    <div class="doors">
      <div class="door">
        <div class="door__eyebrow">Para clientes</div>
        <h2 class="door__title">Portal Cliente</h2>
        <p class="door__desc">Revisa el avance de tu marca: contenido, calendario y resultados.</p>
        <a class="door__btn" href="/clientes/">Ingresar</a>
      </div>
      <div class="door">
        <div class="door__eyebrow">Para el equipo</div>
        <h2 class="door__title">Portal Team</h2>
        <p class="door__desc">Gestión de marcas, estrategia, edición, community y pauta.</p>
        <a class="door__btn door__btn--dark" href="/team/">Ingresar</a>
      </div>
    </div>
    <div class="foot">Versus the common</div>
  </div>
</body>
</html>
